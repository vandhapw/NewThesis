<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
	xmlns:svg="http://www.w3.org/2000/svg"
	xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink"
	version="1.0"
	width="500"
	height="160">

	<defs>
		<radialGradient id="particle" cx="50%" xy="50%" fx="66%" fy="66%" r="50%">
			<stop stop-color="#acc06a" offset="0%" />
			<stop stop-color="#465122" offset="100%" />
		</radialGradient>
		<radialGradient id="source" cx="50%" xy="50%" fx="66%" fy="66%" r="50%">
			<stop stop-color="#0000FF" offset="0%" />
			<stop stop-color="#000080" offset="100%" />
		</radialGradient>
		
		<symbol id="arrow" overflow="visible">
			<path class="line" d="M 0,0 h 50 z" />
			<path class="arrow" d="M 50,0 l -12,4 v -8 z"/>
		</symbol>
		
		<symbol id="arrowhead" overflow="visible">
			<path class="arrow" d="M 0,0 l -12,5 v-8 z"/>
		</symbol>
		
		<symbol id="longarrow" overflow="visible">
			<path class="line" d="M 0,0 h 100 z"/>
			<path class="arrow" d="M 100,0 l -18,6 v -12 z"/>
		</symbol>
	</defs>
	
	<style type="text/css">
		.particle { fill: url(#particle); stroke-width: 1px; stroke: #000; }
		.source { fill: url(#source); stroke-width: 1px; stroke: #000; }
		path { stroke-width: 1px; stroke: #000; }
		path.line { stroke-width: 1px; stroke: #000; }
		.dashed { stroke: #000; stroke-dasharray: 3px, 3px; stroke-width: 1px; fill: none; }
		.arrow { stroke: none; fill: #000; }
		
		.arc { fill: none; stroke-width: 1px; stroke: #000; }
		
		text { font-family: "Bitstream Vera Sans", sans-serif; font-size: 14px; text-anchor: middle; }
		text.big { font-family: "Bitstream Vera Sans", sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
		text.small { font-family: "Bitstream Vera Sans", sans-serif; font-size: 12px; text-anchor: middle; }
	</style>
	
	<g transform="translate(80, 80)">
		<circle class="particle" id="alice" r="50"/>
		<use xlink:href="#arrow"/>
		<use xlink:href="#arrow" transform="rotate(-90)"/>

		<text y="-60">X<tspan dy="5">A</tspan></text>
		<text x="60" y="20">Z<tspan dy="5">A</tspan></text>
		
		<text class="big" y="70">Alice</text>
	</g>
	
	<g transform="translate(420, 80)">
		<circle class="particle" id="bob" r="50"/>
		<use xlink:href="#arrow" transform="rotate(135)"/>
		<use xlink:href="#arrow" transform="rotate(-135)"/>
		<path class="dashed" d="M -50, 0 h 100"/>
		
		<path class="arc" d="M -20,0 A 20,20 0 0,1 -14.1421356,-14.1421356"/>
		<use xlink:href="#arrowhead" transform="translate(-20,0),scale(0.5,0.5),rotate(100)"/>
		<use xlink:href="#arrowhead" transform="translate(-14.1421356,-14.1421356),scale(0.5,0.5),rotate(-45)"/>
		<text class="small" x="-30" y="-7.5">45&#x00B0;</text>

		<text x="-43" y="48">X<tspan dy="5">B</tspan></text>
		<text x="-43" y="-45">Z<tspan dy="5">B</tspan></text>
		
		<text class="big" y="70">Bob</text>
	</g>
	
	<g transform="translate(250, 80)">
		<circle class="source" r="20"/>
		<use xlink:href="#longarrow" x="20"/>
		<use xlink:href="#longarrow" transform="rotate(180)" x="20"/>
		
		<text class="big" y="-25">Source</text>
		<text y="35">&#x03A6;</text>
	</g>
	

</svg>